# Детермінований шлюз безпеки для PR (l10n_ua; далі odoo-addons, uklon_fleet).
# pull_request (НЕ pull_request_target): код форку не отримує секретів, токен лише на читання.
# Усі перевірки дивляться лише на зміни PR (diff), старий код розбирає щотижневий аудит.
# Actions зафіксовані за SHA коміту, gitleaks — за sha256 архіву. Оновлення — окремим PR
# (він сам отримає мітку needs-human, бо змінює .github/).
name: Security gate
on:
  pull_request:
  push:
    branches: ['19.0', '20.0']
permissions:
  contents: read
env:
  # База для diff: на PR — base.sha, на push — попередня голова гілки.
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks (секрети в комітах PR)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --log-opts="$BASE_SHA..$HEAD_SHA" .

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: '3.12' }
      # setuptools<81: semgrep 1.95 (через opentelemetry) імпортує pkg_resources,
      # якого в Python 3.12 без setuptools немає.
      - run: pip install semgrep==1.95.0 'setuptools<81'
      - name: semgrep з правилами під Odoo (лише нові спрацювання)
        run: semgrep scan --config .semgrep/odoo.yml --error --metrics=off --baseline-commit "$BASE_SHA" .

  acl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: '3.12' }
      - name: ACL, record rules, sudo() у публічних маршрутах, nosemgrep без причини
        run: python3 tools/sec/check_odoo.py . --diff "$BASE_SHA"

  # PR з такими змінами отримує мітку needs-human і чекає Святослава; решта йде без людини.
  # Мітку CI лише ставить. Знімає її людина після огляду, тож пізніший коміт не «сховає» ризик.
  # PR із форку має токен лише на читання: мітку поставити не вийде, тоді перевірка червона.
  needs-human:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Зміни CI, правил безпеки, залежностей, нові винятки й зовнішні адреси
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          reasons=""
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if echo "$files" | grep -qE '^\.github/|^\.semgrep/|^tools/sec/|requirements.*\.txt$|^\.gitleaks|^\.security-exceptions|^\.pre-commit'; then
            reasons="$reasons; змінено CI/правила безпеки/залежності"
          fi
          if git diff "$BASE_SHA" "$HEAD_SHA" -- '*__manifest__.py' | grep -qE '^\+.*external_dependencies'; then
            reasons="$reasons; нові external_dependencies"
          fi
          if git diff "$BASE_SHA" "$HEAD_SHA" -- '*.py' | grep -qE '^\+.*(nosemgrep|sudo-ok:)'; then
            reasons="$reasons; нові винятки з правил безпеки"
          fi
          # Хост порівнюємо точно, а не підрядком: evil-odoo.com не пройде як odoo.com.
          ALLOW='^(odoo\.com|www\.odoo\.com|apps\.odoo\.com|github\.com|www\.w3\.org|localhost|127\.0\.0\.1)$'
          urls=$(git diff "$BASE_SHA" "$HEAD_SHA" -- '*.py' '*.js' '*.xml' \
            | grep -E '^\+' | grep -oE 'https?://[A-Za-z0-9.-]+' | sed -E 's#^https?://##' \
            | tr 'A-Z' 'a-z' | sort -u | grep -vE "$ALLOW" | tr '\n' ' ' || true)
          if [ -n "$urls" ]; then
            reasons="$reasons; нові зовнішні адреси: $urls"
          fi
          if [ -z "$reasons" ]; then
            echo "needs-human: людина не потрібна"
            exit 0
          fi
          echo "::warning::needs-human${reasons}"
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-human \
            || { echo "::error::Не вдалося поставити мітку needs-human (PR із форку?)"; exit 1; }
