# Odoo clickbot over the apps holding l10n_ua menus (issue #635).
# The test lives in tools/clickbot/l10n_ua_clickbot_test; its manifest
# `depends` is the list of modules installed here.
name: Clickbot
on:
  pull_request:
    branches: ['20.0']
  workflow_dispatch:
    inputs:
      modules:
        description: 'Comma-separated modules whose apps to click ("all" or empty = every app)'
        required: false
        default: 'all'

concurrency:
  group: clickbot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ODOO_URL: https://nightly.odoo.com/20.0/nightly/src/odoo_20.0.latest.tar.gz
  ODOO_SRC: /home/runner/odoo-src
  DB: clickbot
  OUT: /home/runner/clickbot-out
  # seconds per app and user
  L10N_UA_CLICKBOT_TIMEOUT: '900'

jobs:
  clickbot:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select modules
        id: select
        env:
          BASE_REF: ${{ github.base_ref }}
          MODULES: ${{ inputs.modules }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 tools/clickbot/select_modules.py --base "origin/$BASE_REF"
          else
            python3 tools/clickbot/select_modules.py --modules "${MODULES:-all}"
          fi

      - name: Nothing to click
        if: steps.select.outputs.modules == 'none'
        run: echo "No module installed by l10n_ua_clickbot_test changed, clickbot skipped." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        if: steps.select.outputs.modules != 'none'
        with:
          python-version: '3.12'

      - name: Cache key (weekly Odoo nightly)
        if: steps.select.outputs.modules != 'none'
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Odoo tarball and pip
        if: steps.select.outputs.modules != 'none'
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/odoo.tar.gz
            ~/.cache/pip
          key: odoo-20.0-nightly-py312-${{ steps.week.outputs.week }}

      - name: Install Odoo 20
        if: steps.select.outputs.modules != 'none'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libldap2-dev libsasl2-dev libpq-dev postgresql-client
          [ -s /home/runner/odoo.tar.gz ] || curl -sSfL --retry 3 "$ODOO_URL" -o /home/runner/odoo.tar.gz
          mkdir -p "$ODOO_SRC"
          tar xzf /home/runner/odoo.tar.gz -C "$ODOO_SRC" --strip-components=1
          python -m pip install -q -r "$ODOO_SRC/requirements.txt"
          # external_dependencies of the l10n_ua modules not in Odoo's requirements
          python -m pip install -q httpx h2 paramiko
          python -c "import sys; sys.path.insert(0, '$ODOO_SRC'); import odoo.release as r; print('Odoo', r.version)"
          google-chrome --version

      - name: Install modules (demo data)
        if: steps.select.outputs.modules != 'none'
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          cat > /home/runner/odoo.conf <<EOF
          [options]
          db_host = localhost
          db_port = 5432
          db_user = odoo
          db_password = odoo
          db_name = $DB
          addons_path = $ODOO_SRC/odoo/addons,$GITHUB_WORKSPACE,$GITHUB_WORKSPACE/tools/clickbot
          data_dir = /home/runner/odoo-data
          screenshots = $OUT
          workers = 0
          max_cron_threads = 0
          EOF
          odoo() { PYTHONPATH="$ODOO_SRC" python -m odoo "$@" -c /home/runner/odoo.conf 2>&1 | tee -a "$OUT/odoo-install.log"; }
          odoo server -d "$DB" --with-demo -i base --stop-after-init --no-http
          PYTHONPATH="$ODOO_SRC" python -m odoo shell -c /home/runner/odoo.conf -d "$DB" --no-http < tools/clickbot/setup_company.py 2>&1 | tee -a "$OUT/odoo-install.log"
          odoo server -d "$DB" --with-demo -i account,l10n_ua --stop-after-init --no-http
          odoo server -d "$DB" --with-demo -i l10n_ua_clickbot_test --stop-after-init --no-http
          if grep -E " (ERROR|CRITICAL) " "$OUT/odoo-install.log"; then
            echo "::error::errors while installing the modules, see odoo-install.log"
            exit 1
          fi

      - name: Clickbot
        if: steps.select.outputs.modules != 'none'
        env:
          L10N_UA_CLICKBOT_MODULES: ${{ steps.select.outputs.modules }}
          L10N_UA_CLICKBOT_REPORT: /home/runner/clickbot-out/clickbot-report.json
        run: |
          set -euo pipefail
          PYTHONPATH="$ODOO_SRC" python -m odoo server -c /home/runner/odoo.conf -d "$DB" \
            --test-enable --test-tags click_l10n_ua --stop-after-init \
            2>&1 | tee "$OUT/odoo-clickbot.log"

      - name: Summary
        if: always() && steps.select.outputs.modules != 'none'
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          path = os.path.join(os.environ['OUT'], 'clickbot-report.json')
          if not os.path.exists(path):
              print('### Clickbot\n\nNo report (the run stopped before the test finished).')
              raise SystemExit
          rows = json.load(open(path, encoding='utf-8'))
          failed = [r for r in rows if not r.get('ok')]
          print('### Clickbot: %d app runs, %d failed\n' % (len(rows), len(failed)))
          print('| app | user | result | s |\n|---|---|---|---|')
          for r in rows:
              print('| %s (`%s`) | %s | %s | %s |' % (r['name'], r['app'], r['login'], 'ok' if r.get('ok') else '**FAILED**', r['seconds']))
          with open(os.path.join(os.environ['OUT'], 'failed-apps.txt'), 'w', encoding='utf-8') as f:
              for r in failed:
                  f.write('%s %s\n%s\n\n' % (r['app'], r['login'], r.get('error', '')))
          EOF

      - name: Upload logs
        if: always() && steps.select.outputs.modules != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: clickbot-logs
          path: /home/runner/clickbot-out
          if-no-files-found: ignore
          retention-days: 14
