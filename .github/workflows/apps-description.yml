name: Apps description
on:
  pull_request:
  push:
    branches: ['19.0', '20.0']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 docs/tools/apps_check/check_descriptions.py
      - run: python3 docs/tools/po_check/check_po_refs.py
